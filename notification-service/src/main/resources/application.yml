server:
  port: 8086

spring:
  application:
    name: notification-service
  profiles:
    default: dev
  config:
    import: "${rentporto.config.import:configserver:${CONFIG_SERVER_URL:http://localhost:8888}}"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 10
        multiplier: 1.5
        max-interval: 5000
