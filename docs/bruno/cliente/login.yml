info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{customerEmail}}",
        "password": "{{actorPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("customerToken", res.body.accessToken);
        bru.setVar("customerTokenExpiresAt", Date.now() + res.body.expiresIn * 1000);
    - type: tests
      code: |-
        test("logs in and receives a JWT", function () {
          expect(res.status).to.equal(200);
          expect(res.body.tokenType).to.equal("Bearer");
          expect(res.body.accessToken.split(".")).to.have.lengthOf(3);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
