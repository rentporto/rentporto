info:
  name: Vehicles
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/vehicles?station=OPO&status=AVAILABLE"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("the available vehicles of the airport are listed", function () {
          expect(res.status).to.equal(200);
          expect(res.body.map(vehicle => vehicle.licensePlate)).to.include("AQ-21-RP");
          res.body.forEach(vehicle => {
            expect(vehicle.station).to.equal("OPO");
            expect(vehicle.status).to.equal("AVAILABLE");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
