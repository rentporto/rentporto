info:
  name: Update category
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/categories/SVMR"
  body:
    type: json
    data: |-
      {
        "name": "Group F - Passenger Van",
        "minimumAge": 25,
        "minimumLicenseYears": 3
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("the category has the new requirements", function () {
          expect(res.status).to.equal(200);
          expect(res.body.minimumAge).to.equal(25);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
