info:
  name: Notification history
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/notifications?customerId={{customerId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("the emails sent to the customer are listed, most recent first", function () {
          expect(res.status).to.equal(200);
          expect(res.body).to.be.an("array");
          res.body.forEach(notification => {
            expect(notification.customerId).to.equal(bru.getVar("customerId") || "00000000-0000-0000-0000-000000000000");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
