info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  headers:
    - name: Idempotency-Key
      value: bruno-cliente
  body:
    type: json
    data: |-
      {
        "email": "{{customerEmail}}",
        "password": "{{actorPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("customerId", res.body.userId);
    - type: tests
      code: |-
        test("the account exists", function () {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
