info:
  name: Criar gestor de frota
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/users"
  headers:
    - name: Idempotency-Key
      value: bruno-gestor-de-frota
  body:
    type: json
    data: |-
      {
        "email": "{{fleetManagerEmail}}",
        "password": "{{actorPassword}}",
        "roles": ["FLEET_MANAGER"]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("the account exists", function () {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
