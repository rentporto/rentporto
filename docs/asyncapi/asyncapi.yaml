asyncapi: "3.1.0"
info:
  title: RentPorto messages
  version: "1.0.0"
  description: "External commands and events exchanged through RabbitMQ. Every message travels in the common envelope. Events go to the rentporto.events topic exchange with the routing key {context}.{event}; commands go to their own queue through the default exchange. Messages between modules of the booking-service are internal and are not listed here."
defaultContentType: application/json
servers:
  local:
    host: "localhost:5672"
    protocol: amqp
    description: RabbitMQ of docker-compose
channels:
  customerRegistered:
    address: customer.registered
    description: Routing key on the rentporto.events topic exchange.
    messages:
      customerRegistered:
        $ref: "#/components/messages/CustomerRegistered"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: rentporto.events
          type: topic
          durable: true
          autoDelete: false
          vhost: "/"
        bindingVersion: "0.3.0"
  stationCapacityChanged:
    address: fleet.station-capacity-changed
    description: Routing key on the rentporto.events topic exchange.
    messages:
      stationCapacityChanged:
        $ref: "#/components/messages/StationCapacityChanged"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: rentporto.events
          type: topic
          durable: true
          autoDelete: false
          vhost: "/"
        bindingVersion: "0.3.0"
  vehicleCategoryChanged:
    address: fleet.vehicle-category-changed
    description: Routing key on the rentporto.events topic exchange.
    messages:
      vehicleCategoryChanged:
        $ref: "#/components/messages/VehicleCategoryChanged"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: rentporto.events
          type: topic
          durable: true
          autoDelete: false
          vhost: "/"
        bindingVersion: "0.3.0"
  reservationConfirmed:
    address: reservation.confirmed
    description: Routing key on the rentporto.events topic exchange.
    messages:
      reservationConfirmed:
        $ref: "#/components/messages/ReservationConfirmed"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: rentporto.events
          type: topic
          durable: true
          autoDelete: false
          vhost: "/"
        bindingVersion: "0.3.0"
  reservationCancelled:
    address: reservation.cancelled
    description: Routing key on the rentporto.events topic exchange.
    messages:
      reservationCancelled:
        $ref: "#/components/messages/ReservationCancelled"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: rentporto.events
          type: topic
          durable: true
          autoDelete: false
          vhost: "/"
        bindingVersion: "0.3.0"
  reservationExpired:
    address: reservation.expired
    description: Routing key on the rentporto.events topic exchange.
    messages:
      reservationExpired:
        $ref: "#/components/messages/ReservationExpired"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: rentporto.events
          type: topic
          durable: true
          autoDelete: false
          vhost: "/"
        bindingVersion: "0.3.0"
  reservationNoShow:
    address: reservation.no-show
    description: Routing key on the rentporto.events topic exchange.
    messages:
      reservationNoShow:
        $ref: "#/components/messages/ReservationNoShow"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: rentporto.events
          type: topic
          durable: true
          autoDelete: false
          vhost: "/"
        bindingVersion: "0.3.0"
  paymentFailed:
    address: payment.failed
    description: Routing key on the rentporto.events topic exchange.
    messages:
      paymentFailed:
        $ref: "#/components/messages/PaymentFailed"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: rentporto.events
          type: topic
          durable: true
          autoDelete: false
          vhost: "/"
        bindingVersion: "0.3.0"
  paymentRefunded:
    address: payment.refunded
    description: Routing key on the rentporto.events topic exchange.
    messages:
      paymentRefunded:
        $ref: "#/components/messages/PaymentRefunded"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: rentporto.events
          type: topic
          durable: true
          autoDelete: false
          vhost: "/"
        bindingVersion: "0.3.0"
  depositSettled:
    address: payment.deposit-settled
    description: Routing key on the rentporto.events topic exchange.
    messages:
      depositSettled:
        $ref: "#/components/messages/DepositSettled"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: rentporto.events
          type: topic
          durable: true
          autoDelete: false
          vhost: "/"
        bindingVersion: "0.3.0"
  rentalStarted:
    address: rental.started
    description: Routing key on the rentporto.events topic exchange.
    messages:
      rentalStarted:
        $ref: "#/components/messages/RentalStarted"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: rentporto.events
          type: topic
          durable: true
          autoDelete: false
          vhost: "/"
        bindingVersion: "0.3.0"
  vehicleReturned:
    address: rental.vehicle-returned
    description: Routing key on the rentporto.events topic exchange.
    messages:
      vehicleReturned:
        $ref: "#/components/messages/VehicleReturned"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: rentporto.events
          type: topic
