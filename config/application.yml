server:
  forward-headers-strategy: framework

spring:
  rabbitmq:
    port: 5672
    username: rentporto
    password: ${RABBITMQ_PASSWORD:rentporto}
  flyway:
    locations: classpath:db/migration,classpath:db/messaging
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${rentporto.services.auth}/auth/jwks
          issuer-uri: rentporto

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://${rentporto.zipkin.host}:9411/api/v2/spans
