server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    default: dev
    group:
      dev: native
      k8s: git
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO:file:../config/}
        git:
          uri: https://github.com/rentporto/rentporto
          search-paths: config
          default-label: main
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
