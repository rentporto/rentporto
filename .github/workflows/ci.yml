name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect affected services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # One filter per deployable module. &build lists the files that affect every module;
          # &events adds common-events to the modules that depend on it.
          filters: |
            config-server:
              - &build
                - pom.xml
                - mvnw
                - .mvn/**
                - .sdkmanrc
                - .github/workflows/ci.yml
              - config-server/**
            gateway:
              - *build
              - gateway/**
            auth-service:
              - *build
              - auth-service/**
            customer-service:
              - *build
              - customer-service/**
            fleet-service:
              - *build
              - &events common-events/**
              - fleet-service/**
            booking-service:
              - *build
              - *events
              - booking-service/**
            rental-service:
              - *build
              - *events
              - rental-service/**
            notification-service:
              - *build
              - *events
              - notification-service/**

  build:
    name: Build ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp -pl ${{ matrix.service }} -am verify
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: type=sha,format=long,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Single required status check for branch protection.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
