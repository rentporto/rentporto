name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect affected services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      contracts: ${{ steps.other.outputs.contracts }}
      compose: ${{ steps.other.outputs.compose }}
      kubernetes: ${{ steps.other.outputs.kubernetes }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # One filter per deployable module. &build lists the files that affect every module;
          # &web, &events and &messaging add the shared libraries to the modules that depend on them.
          filters: |
            config-server:
              - &build
                - pom.xml
                - mvnw
                - .mvn/**
                - .sdkmanrc
                - .github/workflows/ci.yml
              - config-server/**
              - config/**
              - customer-service/src/main/resources/application.yml
            gateway:
              - *build
              - &web common-web/**
              - gateway/**
            auth-service:
              - *build
              - *web
              - auth-service/**
              - docs/openapi/auth-service.yaml
            customer-service:
              - *build
              - *web
              - &events common-events/**
              - &messaging common-messaging/**
              - customer-service/**
              - docs/openapi/customer-service.yaml
            fleet-service:
              - *build
              - *web
              - *events
              - *messaging
              - fleet-service/**
              - docs/openapi/fleet-service.yaml
            booking-service:
              - *build
              - *web
              - *events
              - *messaging
              - booking-service/**
              - docs/openapi/booking-service.yaml
            rental-service:
              - *build
              - *web
              - *events
              - *messaging
              - rental-service/**
              - docs/openapi/rental-service.yaml
            notification-service:
              - *build
              - *web
              - *events
              - *messaging
              - notification-service/**
              - docs/openapi/notification-service.yaml
      - id: other
        uses: dorny/paths-filter@v4
        with:
          filters: |
            contracts:
              - docs/asyncapi/**
              - common-events/**
              - infra/rabbitmq/**
              - .github/workflows/ci.yml
            compose:
              - compose.yaml
              - infra/**
              - .github/workflows/ci.yml
            kubernetes:
              - infra/k8s/**
              - infra/postgres/**
              - infra/rabbitmq/**
              - infra/prometheus/**
              - infra/grafana/**
              - deploy.sh
              - .github/workflows/ci.yml

  build:
    name: Build ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Build and test
        run: ./mvnw -B -ntp -pl ${{ matrix.service }} -am verify
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: type=sha,format=long,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  contracts:
    name: Message contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint
        run: npx -y @asyncapi/cli@6.3.1 validate docs/asyncapi/asyncapi.yaml
      - uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Check AsyncAPI and RabbitMQ definitions against the contracts
        run: ./mvnw -B -ntp -pl common-events,common-messaging -am verify

  compose:
    name: Local infrastructure
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify databases and RabbitMQ topology
        run: ./infra/verify.sh
      - if: always()
        name: Stop
        run: docker compose down -v

  kubernetes:
    name: Kubernetes manifests
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate against the Kubernetes schemas
        run: |
          kubectl kustomize --load-restrictor LoadRestrictionsNone infra/k8s/overlays/k3d \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -kubernetes-version 1.33.0 -
      - name: Check probes and resource limits
        run: ./infra/k8s/check-manifests.sh

  # Single required status check for branch protection.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, build, contracts, compose, kubernetes]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
