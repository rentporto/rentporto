apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rentporto

labels:
  - pairs:
      app.kubernetes.io/part-of: rentporto

resources:
  - namespace.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - mailpit.yaml
  - config-server.yaml
  - gateway.yaml
  - ingress.yaml
  - auth-service.yaml
  - customer-service.yaml
  - fleet-service.yaml
  - booking-service.yaml
  - rental-service.yaml
  - notification-service.yaml

configMapGenerator:
  - name: postgres-init
    files:
      - init.sh=../../postgres/init.sh
  - name: rabbitmq-topology
    files:
      - 10-topology.json=../../rabbitmq/definitions.json
  - name: rabbitmq-config
    files:
      - 20-rentporto.conf=../../rabbitmq/rentporto.conf
