apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  labels:
    app.kubernetes.io/name: booking-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: booking-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: /actuator/prometheus
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://config-server:8888/actuator/health/readiness; do echo waiting for config-server; sleep 2; done
              for target in postgres:5432 rabbitmq:5672; do until nc -z -w 2 ${target%:*} ${target#*:}; do echo waiting for $target; sleep 2; done; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: booking-service
          image: ghcr.io/rentporto/booking-service
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            - name: BOOKING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: BOOKING_DB_PASSWORD
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: RABBITMQ_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  labels:
    app.kubernetes.io/name: booking-service
spec:
  selector:
    app.kubernetes.io/name: booking-service
  ports:
    - name: http
      port: 8084
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-service
  labels:
    app.kubernetes.io/name: booking-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-service
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
