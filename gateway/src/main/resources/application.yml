server:
  port: 8080

spring:
  application:
    name: gateway
  profiles:
    default: dev
  config:
    import: "${rentporto.config.import:configserver:${CONFIG_SERVER_URL:http://localhost:8888}}"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 10
        multiplier: 1.5
        max-interval: 5000

springdoc:
  api-docs:
    path: /api/docs/v3/api-docs
  swagger-ui:
    path: /api/docs
    urls-primary-name: fleet-service
    urls:
      - name: auth-service
        url: /api/docs/services/auth-service
      - name: customer-service
        url: /api/docs/services/customer-service
      - name: fleet-service
        url: /api/docs/services/fleet-service
      - name: booking-service
        url: /api/docs/services/booking-service
      - name: rental-service
        url: /api/docs/services/rental-service
      - name: notification-service
        url: /api/docs/services/notification-service
